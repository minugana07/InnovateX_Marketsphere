<!-- GEMINI FLOATING BUTTON -->

<button class="gemini-button"
        id="gemini-button"
        aria-label="Open Gemini assistant">

    <span class="gemini-icon">
        ✦
    </span>

    <span>
        Ask Gemini
    </span>

</button>


<!-- GEMINI PANEL -->

<div class="gemini-panel"
     id="gemini-panel">

    <div class="gemini-header">

        <div>

            <p class="section-label">
                AI ASSISTANT
            </p>

            <h3>
                Ask Gemini
            </h3>

        </div>


        <button class="gemini-close"
                id="gemini-close">
            ×
        </button>

    </div>


    <div class="gemini-intro">

        <p>
            Explore the reasoning behind this assessment,
            market comparison, entry strategy, or risk.
        </p>

    </div>


    <div class="gemini-suggestions">

        <button class="gemini-suggestion">
            Why did this market receive this score?
        </button>

        <button class="gemini-suggestion">
            Explain the main regulatory barriers.
        </button>

        <button class="gemini-suggestion">
            What would need to change before entry?
        </button>

        <button class="gemini-suggestion">
            Compare this market with others.
        </button>

    </div>


    <div class="gemini-input-area">

        <input
            type="text"
            id="gemini-input"
            placeholder="Ask about this market..."
        >

        <button id="gemini-send">
            ↑
        </button>

    </div>

</div>
